<!doctype html>
<html lang="en">
<head>

<title>Harlow &amp; Pierce · Legal.io</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--page:#FAF9F7;--card:#fff;--ink:#050911;--body:#212529;--muted:#585C64;--soft:#6B6F77;--line:#EBEDF1;--hair:rgba(15,23,42,.1);--sunk:#F1F2EE;--cobalt:#0025DE;--cobalt-050:#EAEEFF;--cobalt-100:#D3DBFF;--cobalt-ink:#001BA1;--pub:#85A9E3;--pub-light:#D3DBFF;--neg:#B6B0A6;--neg-light:#E7E3DE;--ok-bg:rgba(4,180,106,.18);--ok:#03643B;--warn-bg:#FFF1DB;--warn:#8A4B00;--risk-bg:#FFF4EC;--risk:#9A3412}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--muted);font:14px/1.45 Inter,system-ui,sans-serif}
a{color:var(--cobalt);text-decoration:none}a:hover{text-decoration:underline}
button,input,select{font:inherit}
h1,h2{margin:0;color:var(--ink)}
.app{display:flex;min-height:100vh}
.side{flex:0 0 232px;background:#fff;border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:15px;font-weight:600;color:var(--ink);padding:4px 6px 14px}
.sec{font-size:12px;font-weight:700;color:var(--muted);padding:12px 6px 4px}
.nav{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;color:#282C34;font-size:14px;white-space:nowrap;border:0;background:none;text-align:left;width:100%;cursor:pointer}
.nav:hover{background:var(--sunk);text-decoration:none}
.nav[aria-current=page]{background:#EDEEEA;font-weight:500}
.nav svg{flex:none}
.nav .dim{color:#A3A3A3}
.pro{margin-left:auto;height:18px;padding:0 6px;border-radius:6px;background:var(--cobalt-050);color:var(--cobalt-ink);font-size:10px;font-weight:700;display:inline-flex;align-items:center}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:48px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.jump{display:flex;align-items:center;justify-content:space-between;width:300px;max-width:45vw;height:30px;padding:0 6px 0 10px;background:#F5F6F5;border-radius:8px;font-size:12.5px;color:#A3A3A3;cursor:text}
.kbd{display:inline-flex;gap:3px}.kbd b{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:4px;background:#EAEBEA;color:#5A5B5A;font-size:10.5px;font-weight:600}
.tbtn{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 14px;border:1px solid #EBEDF1;border-radius:999px;background:#fff;font-size:12.5px;font-weight:500;color:var(--ink);cursor:pointer;text-decoration:none}
.tbtn:hover{border-color:#C8C9C8;text-decoration:none}
.app.collapsed .side{display:none}
.notice{font-size:12px;color:var(--soft)}
.notice b{color:var(--ink);font-weight:600}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:8px;font-size:11px;font-weight:700}
.head{background:#fff;border-bottom:1px solid var(--line)}
.wrap{max-width:1000px;margin:0 auto;padding:0 24px}
.head .wrap{padding-top:20px;padding-bottom:14px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.4px;color:var(--cobalt);text-transform:uppercase}
.h1{font-family:'Inter Tight',Inter,sans-serif;font-size:40px;font-weight:700;letter-spacing:-.8px;line-height:1.1;margin-top:2px}
.sub{margin:6px 0 0;font-size:14px}
.q{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:17px;color:var(--ink);line-height:36px}
.q .w{color:var(--muted)}
.dd{position:relative;display:inline-block}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 14px;background:#fff;border:1px solid #DCDDDC;border-radius:8px;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer}
.chip:hover{border-color:#A3A3A3}
.chip[aria-expanded=true]{border-color:var(--cobalt);box-shadow:0 0 0 3px var(--cobalt-050)}
.titlerow{display:flex;align-items:flex-end;gap:12px 16px;flex-wrap:wrap}
.cmprow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;line-height:1.3;color:var(--soft)}
.cmprow .dd .pop{left:auto;right:0}
.cmp{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 8px;border-radius:6px;border:0;background:none;font-size:13px;font-weight:600;color:var(--body);cursor:pointer}
.cmp:hover{background:var(--sunk)}
.cmp.on{color:var(--cobalt)}
.num{width:120px;height:32px;padding:0 8px;border:1px solid #B9C6F5;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink)}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:40;min-width:240px;padding:6px;background:#fff;border:1px solid rgba(15,23,42,.12);border-radius:8px;box-shadow:0 12px 32px -12px rgba(15,23,42,.28);line-height:1.3}

.opt{display:flex;align-items:flex-start;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:6px;font-size:13.5px;color:var(--ink);text-align:left;cursor:pointer}

.opt .ck{width:14px;color:var(--cobalt)}
.opt small{display:block;font-size:12px;color:var(--soft);margin-top:2px}
.body{padding:20px 24px 64px;display:flex;flex-direction:column;gap:16px;max-width:1000px;width:100%;margin:0 auto}
.card{position:relative;background:#fff;border:1px solid var(--hair);border-radius:6px;box-shadow:0 1px 0 rgba(15,23,42,.04),0 8px 24px -16px rgba(15,23,42,.1)}
.card.full{position:fixed;inset:24px;z-index:60;overflow:auto}
.ch{display:flex;align-items:flex-start;gap:8px;padding:16px 16px 6px 20px}
.ch .t{flex:1;min-width:0}
.ch h2{font-size:16px;font-weight:600}
.ch p{margin:2px 0 0;font-size:12.5px;color:var(--soft)}
.icb{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:0;border-radius:6px;background:none;color:#5A5B5A;cursor:pointer}
.icb:hover{background:var(--sunk);color:var(--ink)}
.cb{padding:6px 20px 18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
.big{font-family:'Inter Tight',Inter,sans-serif;font-size:56px;font-weight:700;letter-spacing:-1.4px;color:var(--ink);line-height:1.05}
.big small{font-family:Inter;font-size:18px;font-weight:500;letter-spacing:0;color:var(--muted)}
.ppill{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;background:var(--cobalt-050);color:var(--cobalt-ink);font-size:14px;font-weight:600}
.lead{margin:8px 0 0;font-size:14.5px;color:var(--body);max-width:740px}
.range{position:relative;height:30px;margin-top:40px}
.range .thin,.range .thick,.range .med,.range .you,.range .tag{position:absolute}
.thin{top:13px;height:4px;background:var(--pub-light);border-radius:2px}
.thick{top:6px;height:18px;background:var(--pub);border-radius:5px}
.med{top:3px;height:24px;width:2px;margin-left:-1px;background:var(--ink)}
.you{top:-6px;bottom:-2px;border-left:2px solid var(--cobalt)}
.you.est{border-left-style:dashed}
.tag{top:-28px;transform:translateX(-50%);padding:1px 7px;border-radius:4px;background:var(--cobalt);color:#fff;border:1px solid var(--cobalt);font-size:11px;font-weight:600;white-space:nowrap}
.tag.est{background:#fff;color:var(--cobalt-ink)}
.rl{position:relative;height:18px;margin-top:4px}
.rl span{position:absolute;transform:translateX(-50%);font-size:11.5px;white-space:nowrap}
.cap{margin-top:4px;font-size:11.5px;color:var(--soft)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-top:18px;border-top:1px solid var(--line)}
.kpi{padding:14px 16px 0 0}
.kpi .l{font-size:12px}
.kpi .v{font-size:22px;font-weight:600;letter-spacing:-.4px;color:var(--ink);margin-top:2px}
.kpi .s{font-size:12px;color:var(--soft);margin-top:2px}
.rows{padding:4px 12px 12px}
.row{display:grid;grid-template-columns:150px minmax(0,1fr) 140px;align-items:center;gap:12px;width:100%;padding:6px 8px;border:0;border-radius:6px;background:none;text-align:left;cursor:pointer}
.row:hover{background:var(--page)}
.row.sel{background:#F3F5FF}
.row .n{font-size:13px;color:var(--ink)}
.row.sel .n{font-weight:600}
.row .bar{position:relative;height:22px;display:block}
.row .bar span{position:absolute;display:block}
.row .v{text-align:right;line-height:1.2}
.row .v b{display:block;font-size:13px;color:var(--ink)}
.row .v i{display:block;font-style:normal;font-size:11.5px;color:var(--soft)}
.dia{top:5px;width:11px;height:11px;margin-left:-5.5px;background:var(--cobalt);border:2px solid var(--cobalt);transform:rotate(45deg)}
.dia.est{background:#fff}
.dia.risk{background:#C2410C;border-color:#C2410C}
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:4px 20px 16px;font-size:11.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.2px;color:var(--soft);background:#F1F2ED;padding:7px 8px;text-align:right}
th:first-child,td:first-child{text-align:left;padding-left:20px}
th:last-child,td:last-child{padding-right:20px}
td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);color:var(--body)}
tr.sel td{font-weight:600;color:var(--ink)}
tbody tr:hover td{background:var(--page)}
.tblwrap{overflow-x:auto}
.foot{margin:0;padding:12px 20px 16px;font-size:12px;color:var(--soft)}
.chart{position:relative;margin:8px 20px 0 64px}
.chart svg{display:block;width:100%;overflow:visible}
.ylab{position:absolute;left:-58px;transform:translateY(-50%);font-size:11px;color:var(--soft)}
.xlab{position:relative;height:22px;margin:0 20px 0 64px}
.xlab span{position:absolute;top:6px;transform:translateX(-50%);font-size:11px;color:var(--soft)}
.ghost{display:inline-flex;align-items:center;height:32px;padding:0 14px;border-radius:999px;border:1px solid rgba(15,23,42,.16);background:#fff;font-size:13px;font-weight:600;color:var(--body);cursor:pointer;white-space:nowrap}
.ghost:hover{border-color:rgba(15,23,42,.32)}
.unlock{display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:6px;border:1px dashed #B9C6F5;background:#F7F8FF}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{background:#fff;border:1px solid var(--hair);border-radius:6px;padding:16px 18px;box-shadow:0 1px 0 rgba(15,23,42,.04),0 8px 24px -16px rgba(15,23,42,.1)}
.tile .l{font-size:11.5px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.tile .v{font-size:30px;font-weight:600;letter-spacing:-.6px;color:var(--ink);margin-top:4px}
.tile .s{font-size:12px;color:var(--soft)}
.li{display:flex;align-items:center;gap:12px;padding:11px 20px;border-top:1px solid var(--line)}
.tip{position:fixed;z-index:90;pointer-events:none;padding:8px 10px;border-radius:6px;background:var(--ink);color:#fff;font-size:12px;line-height:1.45;white-space:pre;box-shadow:0 8px 20px -8px rgba(5,9,17,.5);display:none}
.scrim{position:fixed;inset:0;z-index:55;background:rgba(5,9,17,.45);border:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:95;padding:10px 16px;border-radius:8px;background:var(--ink);color:#fff;font-size:13px}
.about{font-size:12px;color:var(--soft);margin:4px 0 0}
@media (max-width:820px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:70;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .app.navopen .side{transform:none}
  .jump span:first-child{display:none}.jump{width:auto}
  .wrap,.body{padding-left:16px;padding-right:16px}
  .h1{font-size:30px}.big{font-size:42px}
  .row{grid-template-columns:110px minmax(0,1fr) 92px;gap:8px}
  .grid2{grid-template-columns:1fr}
  .chart{margin-left:52px}.xlab{margin-left:52px}
  .notice{display:none}
  .rl span:not(:nth-child(2)){display:none}
}
</style>

<script>
/* ============================================================

const DATA = { source: 'illustrative', asOf: null, real: null };
const LEVELS = ['Partner', 'Counsel', 'Senior associate', 'Associate', 'Junior associate', 'Paralegal'];

/* ---------- helpers ---------- */
const r5 = v => Math.round(v / 5) * 5;
const $ = v => '$' + r5(v).toLocaleString('en-US');
const k$ = v => '$' + Math.round(v) + 'k';
const M$ = v => v >= 1 ? '$' + v.toFixed(v >= 10 ? 1 : 2).replace(/\.?0+$/, '') + 'M' : '$' + Math.round(v * 1000) + 'k';
const pc = x => Math.round(x * 100) + '%';
const ord = n => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };

const DEFAULTS = {

const ST = { route: 'dashboard', lexq: null, proptab: 'rfps', byot: { title: 'Commercial Counsel', arr: 'Remote', dur: '12 Months', hrs: '40 Hours' }, mf: { stars: {}, people: false, locations: false, rates: false, salaries: false }, v: JSON.parse(JSON.stringify(DEFAULTS)), open: null, full: null, done: {}, toast: null };

  const [r, qs] = location.hash.slice(1).split('?');
  if (r && (DEFAULTS[r] || ['myfirm', 'about', 'dashboard', 'lex', 'jobs', 'byot', 'candidates', 'proposals'].includes(r))) ST.route = r;

}
function writeHash() {
  const d = DEFAULTS[ST.route], v = ST.v[ST.route], p = new URLSearchParams();

/* ---------- small view pieces ---------- */
const ICON = {
  dots: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>',
  full: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>',
  menu: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>' };

function shell(inner) {
  return `<div class="app ${ST.navopen ? 'navopen' : ''} ${ST.collapsed ? 'collapsed' : ''}"><nav class="side" aria-label="Main"><div class="brand">Harlow &amp; Pierce</div>
    ${NAV.map(n => n[0] === 'sec' ? `<div class="sec">${n[1]}</div>` : n[0] === 'x' ? `<button class="nav dim" disabled title="Not part of this prototype">${n[1]}</button>` : `<a class="nav" href="#${n[0]}" ${ST.route === n[0] ? 'aria-current="page"' : ''}>${n[1]}${n[2] ? `<span class="pro">${n[2]}</span>` : ''}</a>`).join('')}
</nav>
    <div class="main"><div class="top">
      <button class="icb" aria-label="Toggle sidebar" data-act="navtoggle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
      <label class="jump"><span>Jump to or navigate</span><span class="kbd"><b>⌘</b><b>K</b></span></label>
      <div style="flex:1"></div>
      <button class="tbtn">+ New</button>
      <a class="tbtn" href="#lex"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"/></svg>Ask</a>
      <button class="icb" aria-label="Account"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18c1.5-2 3.4-3 5.5-3s4 1 5.5 3"/></svg></button></div>
    ${inner}</div></div>
    ${ST.full ? '<button class="scrim" aria-label="Exit full screen" data-act="full" data-k=""></button>' : ''}
    ${ST.toast ? `<div class="toast" role="status">${esc(ST.toast)}</div>` : ''}`;
}
function render() {
  const pages = { dashboard: pageDashboard, lex: pageLex, jobs: pageJobs, byot: pageByot, candidates: pageCandidates, proposals: pageProposals, rates: pageRates, salaries: pageSalaries, matters: pageMatters, visibility: pageVisibility, myfirm: pageMyFirm, about: pageAbout };
  document.getElementById('root').innerHTML = shell(pages[ST.route]());
  writeHash();
}
function toast(msg) { ST.toast = msg; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { ST.toast = null; render(); }, 2200); }

/* ---------- events ---------- */
function setPath(key, val) {
  const [page, field] = key.split('.'); const d = DEFAULTS[page][field];
  ST.v[page][field] = typeof d === 'number' ? Number(val) : val;
  if (page === 'matters' && field === 'type') ST.v.matters.phase = MTYPES[val].def;
  if (field === 'cmp' && val === 'typed') { if (page === 'rates') { const r = ratesModel(ST.v.rates).find(x => x.L === ST.v.rates.level); ST.v.rates.typed = r5(EST[ST.v.rates.level] ? EST[ST.v.rates.level] * OFFICES[ST.v.rates.office][1] : r.q[2]); } }
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) { if (ST.open) { ST.open = null; render(); } if (ST.navopen && !e.target.closest('.side')) { ST.navopen = false; render(); } return; }
  const act = b.dataset.act, k = b.dataset.k;
  if (act === 'open') ST.open = ST.open === k ? null : k;
  else if (act === 'set') { setPath(k, b.dataset.v); ST.open = null; }
  else if (act === 'full') { ST.full = ST.full === k || !k ? null : k; ST.open = null; }
  else if (act === 'link') { ST.open = null; navigator.clipboard && navigator.clipboard.writeText(location.href); return toast('Link to this exact view copied'); }
  else if (act === 'csv') { ST.open = null; downloadCsv(k); return toast('CSV downloaded'); }
  else if (act === 'done') ST.done[k] = !ST.done[k];
  else if (act === 'lex') { ST.lexq = k || null; }
  else if (act === 'byot') ST.byot[k] = b.dataset.v;
  else if (act === 'proptab') ST.proptab = k;
  else if (act === 'star') { const n = PRACTICE_AREAS.filter(p => ST.mf.stars[p]).length; if (ST.mf.stars[k]) delete ST.mf.stars[k]; else if (n < 5) ST.mf.stars[k] = true; else return toast('You can star up to 5 areas'); }
  else if (act === 'mf') ST.mf[k] = !ST.mf[k];
  else if (act === 'scroll') { e.preventDefault(); const el = document.getElementById(k); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  else if (act === 'navtoggle') { if (window.innerWidth <= 820) ST.navopen = !ST.navopen; else ST.collapsed = !ST.collapsed; }
  else return;
  render();
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.act === 'input') { setPath(t.dataset.k, t.value || 0); render(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (ST.open || ST.full)) { ST.open = null; ST.full = null; render(); } });
window.addEventListener('hashchange', () => { readHash(); ST.open = null; ST.full = null; ST.navopen = false; render(); window.scrollTo(0, 0); });
const tipEl = document.getElementById('tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { tipEl.style.display = 'none'; return; }
  tipEl.textContent = t.getAttribute('data-tip'); tipEl.style.display = 'block';
  const w = tipEl.offsetWidth, x = Math.min(window.innerWidth - w - 8, Math.max(8, e.clientX - w / 2));
  tipEl.style.left = x + 'px'; tipEl.style.top = Math.max(8, e.clientY - tipEl.offsetHeight - 14) + 'px';
});
function downloadCsv(id) {
  const card = document.querySelector(`[data-act="csv"][data-k="${id}"]`) ? null : null;
  const sec = [...document.querySelectorAll('section.card')].find(s => s.querySelector(`[data-k="menu:${id}"]`));
  let rows = [];
  const tbl = sec && sec.querySelector('table');
  if (tbl) rows = [...tbl.querySelectorAll('tr')].map(tr => [...tr.children].map(c => c.textContent.trim()));
  else if (sec) rows = [['Item', 'Value', 'Detail']].concat([...sec.querySelectorAll('.row')].map(r => [r.querySelector('.n').textContent, r.querySelector('.v b').textContent, r.querySelector('.v i').textContent]));
  if (!rows.length && sec) rows = [...sec.querySelectorAll('[data-col]')].map(r => r.getAttribute('data-tip').split('\n'));
  const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = id + '.csv'; a.click();
}

/* ---------- boot: try a real-data snapshot, then render ---------- */
readHash();
render();
</script>
</body>
</html>
